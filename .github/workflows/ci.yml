name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Explicit globs: Node 24's test runner does not expand directory arguments.
      - run: node --import ./test/module/register.mjs --test "service/test/*.test.mjs" "test/module/*.test.mjs"

  # On a v* tag: refuse a tag that does not match module.json, publish the sidecar image as
  # ghcr.io/<owner>/yuvomi-cleaningplan-api:<version> (tag without the v; :latest only for
  # stable versions), and create the GitHub Release Yuvomi's installer resolves a bare
  # repository address to.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match module.json version
        run: |
          v="v$(node -p "require('./modules/cleaningplan/module.json').version")"
          test "$v" = "$GITHUB_REF_NAME" || { echo "module.json says $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yuvomi-cleaningplan-api
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ./service
          build-contexts: module=./modules/cleaningplan
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then pre=--prerelease; else pre=; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $pre
